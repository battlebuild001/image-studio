name: Content Studio Windows 1.1.0 delivery
on:
  push:
    branches: [codex/desktop-windows-1-1-0-20261120]
    paths: [.github/workflows/content-studio-windows-release.yml]
permissions:
  contents: write
  actions: read
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore the completed Windows installers
        uses: actions/download-artifact@v4
        with:
          name: content-studio-windows-1.1.0
          github-token: ${{ github.token }}
          run-id: 44679324608
          repository: battlebuild001/image-studio
          path: ${{ runner.temp }}
      - name: Verify retained installers with the full NSIS-capable 7-Zip
        shell: pwsh
        env:
          ELECTRON_BUILDER_7ZIP_PATH: C:\Program Files\7-Zip\7z.exe
        run: |
          if (-not (Test-Path $env:ELECTRON_BUILDER_7ZIP_PATH)) { throw 'Full 7-Zip was not found on the Windows runner.' }
          $formats = & $env:ELECTRON_BUILDER_7ZIP_PATH i
          if ($LASTEXITCODE -ne 0 -or -not (($formats -join "`n") -match '(?i)\bnsis\b')) { throw 'The archive verifier must support NSIS.' }
          $folder = "${{ runner.temp }}/content-studio-release"
          Expand-Archive -Path "$folder/Content-Studio-1.1.0-Windows-x64.zip" -DestinationPath "$folder/win-unpacked"
          node --test tests/desktop-build-config.test.mjs tests/desktop-build-verification.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop-build.mjs --win --verify-only --source-archive --output $folder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$folder/desktop-release.json")) { throw 'The verified desktop release manifest was not produced.' }
      - name: Install isolated UI test driver
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - name: Execute the actual packaged Windows application
        shell: pwsh
        run: |
          $env:CONTENT_STUDIO_ELECTRON = "${{ runner.temp }}/content-studio-release/win-unpacked/ContentStudio.exe"
          $env:CONTENT_STUDIO_PACKAGED = '1'
          node scripts/run-desktop-tests.mjs --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Windows runtime verification and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $folder = "${{ runner.temp }}/content-studio-release"
          $testPath = Join-Path ([IO.Path]::GetTempPath()) 'desktop-app-browser-result.json'
          $result = Get-Content -Raw $testPath | ConvertFrom-Json
          if (-not $result.passed -or $result.hostPlatform -ne 'win32' -or -not $result.windowsRuntimeExecuted) { throw 'The packaged Windows smoke test did not pass.' }
          $manifestPath = Join-Path $folder 'desktop-release.json'
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.windowsRuntimeExecuted = $true
          $manifest | Add-Member -NotePropertyName windowsSmokeTest -NotePropertyValue @{passed=$true; platform='win32'; nativeFolderSaveOpen=$result.nativeFolderSaveOpen; stableOriginProcessRestart=$result.stableOriginProcessRestart; source='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 30) + "`n", [Text.UTF8Encoding]::new($false))
          $names = @('Content-Studio-Setup-1.1.0-x64.exe','Content-Studio-1.1.0-Windows-x64-Portable.exe','Content-Studio-1.1.0-Windows-x64.zip','Content-Studio-Source-1.1.0.zip','desktop-release.json')
          $sums = foreach ($name in $names) { $hash = (Get-FileHash (Join-Path $folder $name) -Algorithm SHA256).Hash.ToLower(); "$hash  $name" }
          [IO.File]::WriteAllText((Join-Path $folder 'SHA256SUMS.txt'), (($sums -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
          $notes = gh release view desktop-v1.1.0 --repo battlebuild001/image-studio --json body --jq .body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText((Join-Path $folder 'Content-Studio-1.1.0-Start-Here.txt'), ($notes -join "`n"), [Text.UTF8Encoding]::new($false))
      - name: Upload verified files to the prepared draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $folder = "${{ runner.temp }}/content-studio-release"
          $names = @('Content-Studio-Setup-1.1.0-x64.exe','Content-Studio-1.1.0-Windows-x64-Portable.exe','Content-Studio-1.1.0-Windows-x64.zip','Content-Studio-Source-1.1.0.zip','desktop-release.json','SHA256SUMS.txt','Content-Studio-1.1.0-Start-Here.txt')
          $paths = $names | ForEach-Object { Join-Path $folder $_ }
          gh release upload desktop-v1.1.0 --repo battlebuild001/image-studio --clobber @paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain completed installers and verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-studio-windows-1.1.0-verified
          path: |
            ${{ runner.temp }}/content-studio-release/*.exe
            ${{ runner.temp }}/content-studio-release/*.zip
            ${{ runner.temp }}/content-studio-release/*.json
            ${{ runner.temp }}/content-studio-release/*.txt
            ${{ runner.temp }}/desktop-app-browser-result.json
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 5
